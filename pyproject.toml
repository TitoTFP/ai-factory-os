[project]
name = "ai-factory-os"
version = "0.1.0"
description = "A durable, multi-tenant AI Factory OS"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pytest>=8,<9",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
factory-api = "app.main:run"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: requires OPENAI_API_KEY, OPENAI_BASE_URL, and OPENAI_MODEL",
  "postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
  "docker: requires Docker Compose and RUN_DOCKER_TESTS=1",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
